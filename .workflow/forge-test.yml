# Gitee Go pipeline (native support for Gitee repositories)
# To enable: Gitee repo -> Services -> Gitee Go -> New pipeline -> select this file (.workflow/forge-test.yml)
# Note: runs with no secrets configured -- contract deps are vendored (contracts/lib) and the front-end build uses default settings.
version: 1.0
name: forge-test-and-web-build
displayName: Contract tests + front-end build
triggers:
  push:
    branches:
      include:
        - main
  pull_request:
    branches:
      include:
        - main
stages:
  - stage:
      name: contracts
      displayName: Contract tests (Foundry)
      steps:
        - step: build@nodejs
          name: forge-test
          displayName: forge test
          nodeVersion: 20
          commands:
            - curl -L https://foundry.paradigm.xyz | bash
            - export PATH="$HOME/.foundry/bin:$PATH"
            - foundryup
            - cd contracts
            - forge --version
            - forge build
            - forge test -vv
  - stage:
      name: web
      displayName: Front-end build (Next.js)
      steps:
        - step: build@nodejs
          name: web-build
          displayName: next build
          nodeVersion: 20
          commands:
            - cd web
            - npm ci --no-audit --no-fund
            - npm run build
