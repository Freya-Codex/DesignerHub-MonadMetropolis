name: CI

# 触发：main 分支 push 与所有 PR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: 合约测试（Foundry）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: forge test
        working-directory: contracts
        run: forge test -vv

      - name: 部署脚本语法检查
        working-directory: contracts
        run: forge script script/Deploy.s.sol --help > /dev/null

  web:
    name: 前端构建（Next.js）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: next build
        working-directory: web
        run: npm run build
