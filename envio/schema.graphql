# Envio HyperIndex data model -- Designer Hub · Monad
#
# These entities are written by src/EventHandlers.ts and queried by the front end over GraphQL --
# they are the real data source behind the /trades, /scheme/[id], and /board pages.

"""A minted design scheme (DreamScheme's ERC-721)."""
type Scheme {
  "tokenId (decimal string)"
  id: ID!
  creator: String!
  "Parent scheme tokenId; 0 for a root scheme"
  parentId: BigInt!
  "Scheme content commitment keccak256(contentHash + salt)"
  contentHash: String!
  "AI provider attributed at mint time (AgentRegistry.agentId)"
  agentId: BigInt!
  mintedBlock: BigInt!
  mintedTx: String!
  "Cumulative apply count (incremented by SchemeApplied)"
  appliedCount: Int!
  "Royalty receiver set by the creator"
  royaltyReceiver: String
  "Royalty bps (e.g. 500 = 5%)"
  royaltyBps: BigInt
}

"""A single scheme apply (SchemeMarket.SchemeApplied), i.e. one trade-ledger record."""
type Trade {
  id: ID!
  scheme: Scheme!
  tokenId: BigInt!
  applier: String!
  creator: String!
  price: BigInt!
  creatorCut: BigInt!
  platformCut: BigInt!
  blockNumber: BigInt!
  txHash: String!
  logIndex: Int!
}

"""The share paid to ancestor creators by lineage when a derivative scheme is applied."""
type AncestorPayout {
  id: ID!
  tokenId: BigInt!
  ancestor: String!
  amount: BigInt!
  blockNumber: BigInt!
  txHash: String!
}

"""A registered AI agent (AgentRegistry) and its reputation."""
type Agent {
  id: ID!
  owner: String!
  metadataURI: String!
  reputation: BigInt!
  registeredBlock: BigInt!
}

"""A reputation-change event (AgentRegistry.ReputationAdded)."""
type ReputationEvent {
  id: ID!
  agent: Agent!
  newReputation: BigInt!
  delta: BigInt!
  blockNumber: BigInt!
  txHash: String!
}

"""An on-chain attestation proof (ProvenanceRegistry.Attested), without the content body."""
type Attestation {
  id: ID!
  commitment: String!
  attestor: String!
  agentId: BigInt!
  metadataURI: String!
  blockNumber: BigInt!
  txHash: String!
}
