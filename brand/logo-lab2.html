<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20242e;font-family:"Helvetica Neue",sans-serif;color:#cfd3dc}
  .row{display:flex;gap:26px;padding:26px;align-items:flex-start;flex-wrap:wrap}
  .cell{background:#15181f;border:1px solid #2a2f3a;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .cap{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7c8598}
  .tile{width:200px;height:200px}
  .light .cell{background:#F3EFE5;border-color:#ddd6c6}
  .light .cap{color:#7a7263}
  svg{display:block}
</style>
</head>
<body>

<div class="row">
  <!-- A2 refined lineage roof -->
  <div class="cell">
    <div class="cap">A2 · Roof Graph</div>
    <svg class="tile" viewBox="0 0 512 512">
      <defs>
        <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
          <path d="M32 0H0V32" fill="none" stroke="#6C8CFF" stroke-opacity=".10" stroke-width="1"/>
        </pattern>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0E1730"/><stop offset="1" stop-color="#080D1A"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="116" fill="url(#bg)"/>
      <rect width="512" height="512" rx="116" fill="url(#g)"/>
      <g stroke="#EDE7D9" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M256 150 L176 236"/>
        <path d="M256 150 L336 236"/>
        <path d="M176 236 L110 320"/>
        <path d="M336 236 L402 320"/>
        <path d="M110 320 L110 396 L402 396 L402 320"/>
      </g>
      <rect x="234" y="342" width="44" height="54" fill="#EDE7D9"/>
      <g fill="#EDE7D9">
        <circle cx="176" cy="236" r="15"/><circle cx="336" cy="236" r="15"/>
        <circle cx="110" cy="320" r="15"/><circle cx="402" cy="320" r="15"/>
      </g>
      <circle cx="256" cy="150" r="23" fill="#FF8A34"/>
    </svg>
  </div>

  <!-- B1 pointy hex refined -->
  <div class="cell">
    <div class="cap">B1 · Hex Hub (pointy)</div>
    <svg class="tile" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0E1730"/><stop offset="1" stop-color="#080D1A"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="116" fill="url(#bg2)"/>
      <rect width="512" height="512" rx="116" fill="url(#g)"/>
      <path d="M256 90 L400 173 L400 339 L256 422 L112 339 L112 173 Z"
            fill="none" stroke="#EDE7D9" stroke-width="14" stroke-linejoin="round"/>
      <g stroke="#EDE7D9" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M170 290 L256 222 L342 290"/>
        <path d="M186 284 L186 374 L326 374 L326 284"/>
      </g>
      <rect x="234" y="330" width="44" height="44" fill="#EDE7D9"/>
      <g fill="#FF8A34">
        <circle cx="256" cy="90" r="17"/>
        <circle cx="112" cy="339" r="17"/>
        <circle cx="400" cy="339" r="17"/>
      </g>
    </svg>
  </div>

  <!-- B2 flat-top hex -->
  <div class="cell">
    <div class="cap">B2 · Hex Hub (flat-top)</div>
    <svg class="tile" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0E1730"/><stop offset="1" stop-color="#080D1A"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="116" fill="url(#bg3)"/>
      <rect width="512" height="512" rx="116" fill="url(#g)"/>
      <path d="M426 256 L341 109 L171 109 L86 256 L171 403 L341 403 Z"
            fill="none" stroke="#EDE7D9" stroke-width="14" stroke-linejoin="round"/>
      <g stroke="#EDE7D9" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M172 300 L256 232 L340 300"/>
        <path d="M188 294 L188 384 L324 384 L324 294"/>
      </g>
      <rect x="234" y="340" width="44" height="44" fill="#EDE7D9"/>
      <g fill="#FF8A34">
        <circle cx="86" cy="256" r="17"/>
        <circle cx="426" cy="256" r="17"/>
        <circle cx="341" cy="109" r="17"/>
      </g>
    </svg>
  </div>

  <!-- C seal -->
  <div class="cell">
    <div class="cap">C · Seal</div>
    <svg class="tile" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0E1730"/><stop offset="1" stop-color="#080D1A"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="116" fill="url(#bg4)"/>
      <circle cx="256" cy="252" r="165" fill="#EDE7D9"/>
      <g stroke="#0B1220" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M150 258 L256 172 L362 258"/>
        <path d="M182 250 L182 352 L330 352 L330 250"/>
      </g>
      <rect x="234" y="300" width="44" height="52" rx="5" fill="#0B1220"/>
      <g fill="#FF8A34">
        <circle cx="150" cy="258" r="15"/><circle cx="256" cy="172" r="20"/><circle cx="362" cy="258" r="15"/>
      </g>
    </svg>
  </div>
</div>

<!-- Wordmark tests -->
<div class="row">
  <div class="cell" style="width:640px">
    <div class="cap">Wordmark · Avenir Next Demi</div>
    <div style="display:flex;align-items:center;gap:22px">
      <svg width="96" height="96" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="url(#bg2)"/>
        <path d="M256 90 L400 173 L400 339 L256 422 L112 339 L112 173 Z" fill="none" stroke="#EDE7D9" stroke-width="16" stroke-linejoin="round"/>
        <g stroke="#EDE7D9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M170 290 L256 222 L342 290"/><path d="M186 284 L186 374 L326 374 L326 284"/></g>
        <g fill="#FF8A34"><circle cx="256" cy="90" r="20"/><circle cx="112" cy="339" r="20"/><circle cx="400" cy="339" r="20"/></g>
      </svg>
      <div style="font-family:'Avenir Next','Avenir';color:#EDE7D9;font-weight:600;font-size:54px;letter-spacing:-.01em;line-height:1">Designer&nbsp;Hub</div>
    </div>
  </div>

  <div class="cell light" style="width:640px">
    <div class="cap">Wordmark · Futura Medium (on paper)</div>
    <div style="display:flex;align-items:center;gap:22px">
      <svg width="96" height="96" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="#0B1220"/>
        <path d="M256 90 L400 173 L400 339 L256 422 L112 339 L112 173 Z" fill="none" stroke="#EDE7D9" stroke-width="16" stroke-linejoin="round"/>
        <g stroke="#EDE7D9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M170 290 L256 222 L342 290"/><path d="M186 284 L186 374 L326 374 L326 284"/></g>
        <g fill="#FF8A34"><circle cx="256" cy="90" r="20"/><circle cx="112" cy="339" r="20"/><circle cx="400" cy="339" r="20"/></g>
      </svg>
      <div style="font-family:'Futura','Avenir Next';color:#0B1220;font-weight:500;font-size:54px;letter-spacing:-.01em;line-height:1">Designer&nbsp;Hub</div>
    </div>
  </div>
</div>

</body>
</html>
